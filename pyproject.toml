[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statik3d"
version = "2.1.0"
description = "Finite-Elemente-Statikprogramm: Stab/Schale/Volumen, Lastfaelle und Kombinationen, Kontakt, EC3-Nachweise, Rechnerfarm"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
gui = ["PySide6>=6.5", "pyvista>=0.42", "pyvistaqt>=0.11"]
cad = ["gmsh>=4.11"]
pdf = ["reportlab", "svglib"]
fast = ["pypardiso", "mkl"]
qr = ["qrcode"]

[project.scripts]
statik3d = "statik3d.cli:main"
statik3d-gui = "statik3d.gui.main:main"
statik3d-farm = "statik3d.farm:main"
statik3d-web = "statik3d.web.__main__:main"

[tool.setuptools.packages.find]
include = ["statik3d*"]

[tool.setuptools.package-data]
"statik3d.web" = ["static/*"]
