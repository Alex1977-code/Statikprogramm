name: Windows-Programm

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    name: Statik3D.exe bauen
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          # pypardiso und mkl stehen in requirements.txt: ohne sie faellt der
          # Loeser auf SuperLU zurueck, und das rechnet auf genau einem Kern.
          pip install -r requirements.txt pyinstaller pillow reportlab svglib qrcode
          # ama, der eigene Rechenkern, steht auf keinem Paketserver: das Rad
          # liegt im Baum (wie das MUMPS-Rad). Ohne diese Zeile fehlte er in
          # der exe, und die Loeserauswahl zeigte ihn grau (19.09.2026).
          pip install packaging/ama-0.1.0-cp311-cp311-win_amd64.whl

      - name: Build-Stempel schreiben
        run: python packaging/write_build.py ${{ github.sha }}

      - name: Programmsymbol und Startbild erzeugen
        run: python packaging/make_icon.py

      - name: exe bauen (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/Statik3D.spec

      - name: Selbsttest der exe
        shell: pwsh
        run: |
          "Groesse: {0:N1} MB" -f ((Get-Item dist\Statik3D.exe).Length / 1MB)
          $p = Start-Process -FilePath dist\Statik3D.exe -ArgumentList "--selbsttest" -PassThru
          if (-not $p.WaitForExit(240000)) {
            $p.Kill()
            if (Test-Path statik3d_selbsttest.txt) { Get-Content statik3d_selbsttest.txt }
            throw "Selbsttest: Zeitueberschreitung nach 240 s (haengt die exe in einem Meldungsfenster?)"
          }
          if (Test-Path statik3d_selbsttest.txt) { Get-Content statik3d_selbsttest.txt } else { "keine statik3d_selbsttest.txt geschrieben" }
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Exit-Code $($p.ExitCode))" }

      - name: exe als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Statik3D-exe-${{ github.sha }}
          path: dist/Statik3D.exe

      - name: Tag "latest" auf diesen Stand setzen
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest ${{ github.sha }}
          git push -f origin latest

      - name: Release "latest" veroeffentlichen
        if: github.ref == 'refs/heads/main'
        # Mit dem GitHub-Werkzeug statt mit einer Aktion (17.09.2026): das
        # Veroeffentlichen scheiterte dreimal - erst hing der Upload (14,8 und
        # 38,5 min), dann brach er nach 30 s ab -, und jedes Mal blieb das
        # Release ohne Statik3D.exe. "gh release upload --clobber" ersetzt die
        # Datei gezielt, versucht es dreimal und schreibt jede Meldung ins
        # Protokoll dieses Schrittes.
        timeout-minutes: 30
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          # Die Release-Notizen ueber eine Datei: ein PowerShell-Here-String
          # braeuchte sein "@ in Spalte 0, und in YAML ist alles eingerueckt.
          $zeilen = @(
            "Automatisch gebaut aus main.",
            "",
            "build: ${{ github.sha }}",
            "Datum: ${{ github.event.head_commit.timestamp }}",
            "",
            "Download: Statik3D.exe (Windows 10/11, 64 Bit). Beim ersten Start meldet",
            "Windows SmartScreen ein unbekanntes Programm: Weitere Informationen, dann Trotzdem ausfuehren."
          )
          Set-Content -Path release_notizen.md -Value $zeilen -Encoding utf8
          gh release view latest --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            "Release latest gibt es noch nicht - wird angelegt"
            gh release create latest --repo $repo --title "Statik3D - neueste Version" --notes-file release_notizen.md --latest
            if ($LASTEXITCODE -ne 0) { throw "gh release create fehlgeschlagen ($LASTEXITCODE)" }
          } else {
            gh release edit latest --repo $repo --title "Statik3D - neueste Version" --notes-file release_notizen.md --latest
            if ($LASTEXITCODE -ne 0) { "Hinweis: gh release edit meldete $LASTEXITCODE - weiter mit dem Upload" }
          }
          $datei = "dist/Statik3D.exe"
          $mb = [math]::Round((Get-Item $datei).Length / 1MB, 1)
          $ok = $false
          foreach ($versuch in 1..3) {
            "Versuch $versuch - $datei ($mb MB) hochladen"
            $t0 = Get-Date
            gh release upload latest $datei --repo $repo --clobber
            $code = $LASTEXITCODE
            $dauer = [math]::Round(((Get-Date) - $t0).TotalSeconds, 0)
            if ($code -eq 0) { "  hochgeladen in $dauer s"; $ok = $true; break }
            "  fehlgeschlagen nach $dauer s (Exit-Code $code)"
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { throw "Statik3D.exe liess sich in drei Versuchen nicht hochladen" }

      - name: Pruefen, dass das Release die exe traegt
        if: always() && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $r = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" -Headers @{ "User-Agent" = "statik3d" }
          $a = @($r.assets | Where-Object { $_.name -eq "Statik3D.exe" })
          if ($a.Count -eq 0) { throw "Das Release latest hat keine Statik3D.exe - niemand kann laden" }
          "Release latest: Statik3D.exe, $($a[0].size) Bytes, $($a[0].updated_at)"
