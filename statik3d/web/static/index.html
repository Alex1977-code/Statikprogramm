<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1c2733">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Statik3D">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Statik3D</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header id="top">
  <div class="title"><span class="logo">Statik3D</span><span id="model-name">–</span></div>
  <div class="right"><span id="status-pill" class="pill">verbinde…</span></div>
</header>
<main id="main">
  <div id="view-wrap">
    <canvas id="view"></canvas>
    <div id="view-tools">
      <button data-view="iso" title="Isometrisch">3D</button>
      <button data-view="xy" title="Draufsicht">XY</button>
      <button data-view="xz" title="Ansicht">XZ</button>
      <button data-view="yz" title="Seitenansicht">YZ</button>
      <button data-view="fit" title="Zoom alles">⤢</button>
      <button id="btn-pick" title="Auswahl: Knoten / Elemente">Kn</button>
      <button id="btn-clear-sel" title="Auswahl aufheben">✕</button>
      <button id="btn-deform" class="on" title="Verformt darstellen">u</button>
      <button id="btn-labels" title="Nummern anzeigen">#</button>
    </div>
    <div id="sel-info"></div>
    <div id="legend" hidden></div>
    <div id="view-hint">Tippen: Knoten wählen · Ziehen: drehen · 2 Finger: zoom/schieben</div>
  </div>
  <section id="sheet">
    <div id="sheet-handle" title="Ziehen oder tippen: Bereich vergrößern/verkleinern"><span></span></div>
    <div id="panel"></div>
  </section>
  <nav id="tabs">
    <button data-tab="modell"><span class="ic">⬡</span>Modell</button>
    <button data-tab="lasten"><span class="ic">⇩</span>Lasten</button>
    <button data-tab="rechnen"><span class="ic">▶</span>Rechnen</button>
    <button data-tab="ergebnisse"><span class="ic">∿</span>Ergebnisse</button>
    <button data-tab="nachweise"><span class="ic">✓</span>Nachweise</button>
    <button data-tab="mehr"><span class="ic">≡</span>Mehr</button>
  </nav>
</main>
<div id="toast" hidden></div>
<div id="modal" hidden><div class="box"><div id="modal-body"></div></div></div>
<script src="/app.js"></script>
</body>
</html>
